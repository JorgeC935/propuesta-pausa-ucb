
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Administración | Pausa Coffee Express</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="icon" href="/assets/icons/favicon-48.png">

  <style>
    [hidden] { display: none !important; }

    .contenedor {
      width: min(100% - 32px, 760px);
      margin: 32px auto 64px;
    }

    .encabezado {
      margin-bottom: 30px;
    }

    .encabezado img {
      width: 125px;
      display: block;
      margin-bottom: 20px;
    }

    .volver {
      display: inline-block;
      margin-bottom: 24px;
      color: inherit;
    }

    .panel {
      padding: 24px;
      margin-bottom: 20px;
      background: #fff;
      border: 1px solid #d7d1c8;
    }

    .panel h2 {
      margin-bottom: 16px;
      font-size: 1.2rem;
    }

    .formulario {
      display: grid;
      gap: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #777;
      background: white;
      font: inherit;
    }

    .accion {
      padding: 13px 18px;
      border: 1px solid #222;
      background: #222;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .accion.secundaria {
      background: white;
      color: #222;
    }

    .accion:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .empleado {
      padding: 14px 0;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .empleado small {
      display: block;
      color: #666;
      margin-top: 4px;
    }

    .acciones {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .acciones button {
      padding: 9px 12px;
      border: 1px solid #555;
      background: white;
      font: inherit;
      cursor: pointer;
    }

    #mensaje {
      margin: 16px 0;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    @media (max-width: 500px) {
      .contenedor { margin-top: 20px; }
      .panel { padding: 18px; }
      .accion { width: 100%; }
    }
  </style>
</head>

<body>
  <main class="contenedor">
    <header class="encabezado">
      <img src="/assets/img/logo-negro-360.webp"
           alt="Pausa Coffee Express">
      <a class="volver" href="/personal">
        Volver al panel del personal
      </a>
      <h1>Administración</h1>
    </header>

    <p id="cargando">Comprobando permisos...</p>
    <p id="mensaje" role="status" aria-live="polite"></p>

    <div id="contenido" hidden>
      <section class="panel">
        <h2>WhatsApp del negocio</h2>

        <form id="form-whatsapp" class="formulario">
          <div>
            <label for="whatsapp">Número de contacto</label>
            <input id="whatsapp"
                   type="tel"
                   placeholder="71234567 o +59171234567">
          </div>

          <button type="submit" class="accion">
            Guardar WhatsApp
          </button>
        </form>
      </section>

      <section class="panel">
        <h2>Crear empleado</h2>

        <form id="form-crear" class="formulario">
          <div>
            <label for="nuevo-usuario">
              Nombre de usuario
            </label>
            <input id="nuevo-usuario"
                   autocomplete="off"
                   minlength="3"
                   maxlength="32"
                   required>
          </div>

          <div>
            <label for="nueva-clave">
              Contraseña (mínimo 12 caracteres)
            </label>
            <input id="nueva-clave"
                   type="password"
                   minlength="12"
                   maxlength="128"
                   autocomplete="new-password"
                   required>
          </div>

          <div>
            <label for="confirmar-clave">
              Confirmar contraseña
            </label>
            <input id="confirmar-clave"
                   type="password"
                   minlength="12"
                   maxlength="128"
                   autocomplete="new-password"
                   required>
          </div>

          <button type="submit" class="accion">
            Crear empleado
          </button>
        </form>
      </section>

      <section class="panel">
        <h2>Usuarios registrados</h2>
        <div id="lista-empleados"></div>
      </section>

      <section id="zona-reset" class="panel" hidden>
        <h2>Restablecer contraseña</h2>
        <p id="destinatario-reset"></p>

        <form id="form-reset" class="formulario">
          <div>
            <label for="clave-reset">
              Nueva contraseña
            </label>
            <input id="clave-reset"
                   type="password"
                   minlength="12"
                   maxlength="128"
                   autocomplete="new-password"
                   required>
          </div>

          <div>
            <label for="confirmar-reset">
              Confirmar nueva contraseña
            </label>
            <input id="confirmar-reset"
                   type="password"
                   minlength="12"
                   maxlength="128"
                   autocomplete="new-password"
                   required>
          </div>

          <button type="submit" class="accion">
            Guardar nueva contraseña
          </button>

          <button id="cancelar-reset" type="button"
                  class="accion secundaria">
            Cancelar
          </button>
        </form>
      </section>
    </div>
  </main>

  <script src="/assets/js/administracion.js" defer></script>
</body>
</html>
