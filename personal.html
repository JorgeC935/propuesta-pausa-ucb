
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Personal | Pausa Coffee Express</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="icon" href="/assets/icons/favicon-48.png">

  <style>
    [hidden] { display: none !important; }

    .personal {
      width: min(100% - 32px, 480px);
      margin: 48px auto;
    }

    .cabecera {
      text-align: center;
      margin-bottom: 32px;
    }

    .cabecera img {
      width: 150px;
      margin: 0 auto 20px;
    }

    .cabecera h1 {
      font-size: 1.8rem;
    }

    .tarjeta {
      padding: 24px;
      background: #fff;
      border: 1px solid var(--line);
    }

    .formulario {
      display: grid;
      gap: 16px;
    }

    .campo {
      display: grid;
      gap: 6px;
    }

    .campo label {
      font-size: 0.85rem;
      font-weight: 800;
    }

    .campo input {
      width: 100%;
      height: 54px;
      border: 1px solid var(--ink);
      border-radius: 0;
      padding: 12px;
      background: #fff;
      font: inherit;
    }

    .formulario .btn,
    .ancho {
      width: 100%;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .separador {
      height: 1px;
      background: var(--line);
      margin: 24px 0;
    }

    .mensaje {
      margin-top: 16px;
      font-size: 0.9rem;
      overflow-wrap: anywhere;
    }

    .mensaje.error {
      color: var(--closed);
    }

    .mensaje.exito {
      color: var(--ok);
    }

    .barra {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .barra button {
      border: none;
      background: none;
      text-decoration: underline;
      cursor: pointer;
      font: inherit;
      font-size: 0.85rem;
    }

    .administracion {
      margin-top: 24px;
      padding: 20px;
      border: 1px solid var(--line);
      background: var(--cream);
    }

    .administracion h2 {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    @media (max-width: 480px) {
      .personal { margin: 24px auto; }
      .tarjeta { padding: 20px; }
    }
  </style>
</head>

<body>
  <main class="personal">
    <header class="cabecera">
      <img src="/assets/img/logo-negro-360.webp"
           alt="Pausa Coffee Express">
      <h1>Panel del personal</h1>
    </header>

    <section id="cargando">
      <p class="muted">Comprobando sesión...</p>
    </section>

    <section id="pantalla-login" class="tarjeta" hidden>
      <h2>Iniciar sesión</h2>
      <p class="muted small" style="margin: 12px 0 24px">
        Acceso exclusivo para personal autorizado.
      </p>

      <form id="form-login" class="formulario">
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input id="usuario" name="usuario"
                 autocomplete="username" required>
        </div>

        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input id="contrasena" name="contrasena"
                 type="password"
                 autocomplete="current-password"
                 required>
        </div>

        <button class="btn btn--primary" type="submit">
          Ingresar
        </button>
      </form>

      <p id="mensaje-login"
         class="mensaje" role="status"></p>
    </section>

    <section id="pantalla-panel" hidden>
      <div class="barra">
        <span id="usuario-actual" class="small"></span>
        <button id="cerrar-sesion" type="button">
          Cerrar sesión
        </button>
      </div>

      <div class="tarjeta">
        <h2>Registrar sello</h2>
        <p class="muted small" style="margin: 12px 0 24px">
          Registra una compra pagada.
        </p>

        <form id="form-sello" class="formulario">
          <div class="campo">
            <label for="telefono">
              Número de celular del cliente
            </label>

            <input
              id="telefono"
              name="telefono"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              maxlength="8"
              pattern="[0-9]{8}"
              placeholder="Ej. 71234567"
              required>
          </div>

          <button class="btn btn--primary"
                  type="submit">
            Registrar sello
          </button>
        </form>

        <p id="mensaje-sello"
           class="mensaje" role="status"></p>

        <div class="separador"></div>

        <button class="btn btn--secondary ancho"
                type="button" disabled>
          Escanear QR — próximamente
        </button>
      </div>

      <section id="zona-admin"
               class="administracion" hidden>
        <h2>Administración</h2>
        <p class="small">
          Acceso de administrador reconocido.
          La gestión de empleados y la configuración
          del negocio se incorporarán en el
          siguiente bloque.
        </p>
      </section>
    </section>
  </main>

  <script src="/assets/js/personal.js" defer></script>
</body>
</html>
